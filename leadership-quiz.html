.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;padding:14px 40px;border-radius:50px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 15px rgba(37,197,189,.35)}

.btn-secondary{background:#f0f0f0;color:var(--text);border:none;padding:12px 28px;border-radius:50px;font-size:15px;font-weight:500;cursor:pointer}
.btn-secondary:hover{background:#e0e0e0}
.tm-quote{font-size:14px;color:var(--text-light);font-style:italic;padding:12px 20px;background:var(--primary-light);border-radius:12px;border-left:4px solid var(--primary)}
.author-link{font-size:14px;color:var(--text-light)}
.test-container{padding:28px 32px;text-align:left}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.topbar-emoji{font-size:22px}
.topbar-name{font-size:14px;color:var(--text-light);white-space:nowrap}
.name-input-wrap{margin:22px 0 4px;display:flex;justify-content:center}

.question-list{display:flex;flex-direction:column;gap:20px;margin-bottom:24px;max-height:60vh;overflow-y:auto}

.question-item.selected{border-color:var(--primary);background:var(--primary-light)}
.question-num{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.question-text{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5}
.option-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .option-btn{padding:10px 14px;background:#fff;border:2px solid #e8e8e8;border-radius:10px;font-size:14px;cursor:pointer;transition:all 0.25s;text-align:left;line-height:1.4}
 .option-btn:hover{border-color:var(--primary);background:var(--primary-light)}
 .option-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
.actions-bottom{border-top:1px solid #eee;padding-top:20px}
.hint{font-size:13px;color:var(--text-light);margin-bottom:16px;text-align:center}
.actions-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.result-container{padding:32px;text-align:center}
.result-header{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:28px}
.result-icon-wrap{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:4px}
.type-badge{display:inline-block;padding:6px 20px;border-radius:50px;font-size:13px;font-weight:600;margin-bottom:8px}
.type-name{font-size:42px;font-weight:900;letter-spacing:2px;margin-bottom:4px}
.match-badge{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:6px 20px;border-radius:50px;font-size:14px;font-weight:700}
.analysis-box{background:#fafafa;border-radius:12px;padding:24px;text-align:left;margin-bottom:16px}
.box-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
.desc-text{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:16px}
.score-item{margin:5px 0;font-size:15px;color:var(--text)}
.tips-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips-list li{font-size:14px;color:var(--text-light);padding-left:20px;position:relative}
.tips-list li::before{content:"💡";position:absolute;left:0}
.others-view-grid{display:flex;flex-direction:column;gap:12px}
.others-view-card{display:flex;align-items:flex-start;gap:10px;padding:14px;background:#fff;border-radius:10px;border-left:4px solid;text-align:left}
.others-view-card .card-emoji{font-size:22px;flex-shrink:0;margin-top:2px}
.others-view-card .card-label{font-weight:700;font-size:14px;margin-bottom:4px}
.others-view-card .card-text{font-size:14px;color:#555;line-height:1.6}
.summit-box{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:16px;border-top:1px solid #eee;font-size:13px;color:var(--text-light)}
.retest-btn{display:inline-block;margin-top:16px;padding:10px 28px;border:2px solid var(--primary);border-radius:50px;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;background:transparent}
.retest-btn:hover{background:var(--primary);color:#fff}
.other-styles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.other-style-chip{padding:6px 16px;border-radius:50px;font-size:13px;font-weight:600;border:2px solid #e0e0e0;color:var(--text-light)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeInUp .5s ease forwards}
@keyframes scaleIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.scale-in{animation:scaleIn .4s ease forwards}
@media(max-width:600px){.card{padding:28px 20px}.hero-title{font-size:26px}.option-list{grid-template-columns:1fr}.type-name{font-size:32px}}
</style>
</head>

</section>
<section id="resultScreen" class="screen">

</section>

 bureaucratic:{emoji:"📋",color:"#8c8c8c",bg:"rgba(140,140,140,0.12)",name:"官僚型",desc:"你是一个官僚型领导者！注重规则和流程，强执行、高控制。喜欢结构化、规范化的环境，通过严格的程序和政策来确保任务完成。风险意识强、稳健可靠，适合标准化场景和紧急决策。但要小心过度控制可能抑制团队的主动性和创造力。",tips:["与权威型沟通：直接切入重点，简洁高效","与创新型沟通：给他们空间和自由度，避免过度约束","与亲和型沟通：注重关系维护，放慢节奏","与教练型沟通：提供支持性反馈，鼓励发展"],view:{authoritative:"觉得你太死板、缺乏灵活度。欣赏你的可靠性，但认为你过于依赖程序。",creative:"觉得你太保守、不敢冒险。理解你的稳健，但也希望你多给尝试空间。",supportive:"觉得你过于严肃、缺乏情感温度。觉得你像一台精密机器，但团队还需要温度。",coaching:"觉得你做决定太慢、过于谨慎。欣赏你的风险意识，但认为你有时用程序拖延决策。"}},

 servant:{emoji:"🌍",color:"#0d7c66",bg:"rgba(13,124,102,0.12)",name:"无私型",desc:"你是一个无私型领导者！重服务、善倾听、赋能他人，是团队的服务者而非指挥官。谦逊低调，把团队需求放在第一位，善于授权和赋能他人。关注长期团队建设，适合文化建设和可持续团队。但要避免过度服务而失去方向，该引领时也要引领。",tips:["与权威型沟通：用服务精神影响，展示价值","与创新型沟通：赋能创意，给资源支持","与亲和型沟通：共建情感连接","与教练型沟通：协作培养，形成合力"],view:{authoritative:"觉得你过于被动、缺乏方向感。希望你能更主动设定方向。",creative:"觉得你过于保守、不够冒险。希望关键时刻推动创新。",supportive:"觉得你缺乏个人立场。希望坚持自己的价值观。",coaching:"觉得你服务过度、失去自我。希望也关注自己的成长。"}}
};

let ans = {};
 let userName = '';
const box = document.getElementById("questionList");

// Build DOM first, then attach events (like original — works correctly)
questions.forEach(q => {
 const d = document.createElement("div");
 d.className = "question-item";
 d.id = "q-" + q.id;
 d.innerHTML = `<div class="question-num">📝 第 ${q.id} 题</div>
 <div class="question-text">${q.t}</div>
 <div class="option-list" data-id="${q.id}">
 <div class="option-btn" data-v="3">完全符合 (3分)</div>
 <div class="option-btn" data-v="2">比较符合 (2分)</div>
 <div class="option-btn" data-v="1">不太符合 (1分)</div>
 <div class="option-btn" data-v="0">完全不符合 (0分)</div>
 </div>`;
 box.appendChild(d);
});

// Event delegation — clean, no quote issues
document.querySelectorAll(".option-list").forEach(el => {
 el.onclick = e => {
   if (e.target.classList.contains("option-btn")) {
     ans[el.dataset.id] = +e.target.dataset.v;
     el.querySelectorAll(".option-btn").forEach(o => o.classList.remove("selected"));
     e.target.classList.add("active");
     el.closest(".question-item").classList.add("selected");
     document.getElementById("submitBtn").disabled = Object.keys(ans).length !== 48;
     updateProgress();
   }
 };
});

function updateProgress() {
 const done = Object.keys(ans).length;
 document.getElementById("progressBar").style.width = (done / questions.length * 100) + "%";
 document.getElementById("progressText").textContent = done + " / " + questions.length;
 const hint = document.getElementById("testHint");
 if (done === questions.length) {
   hint.textContent = "🎉 太棒了！所有题目已完成，点击提交答案查看结果！";
   hint.style.color = "var(--primary)";
 } else {
   hint.textContent = "💡 请完成所有题目。(" + done + "/" + questions.length + ")";
   hint.style.color = "#666";
 }
}

// Button events
document.getElementById("startBtn").onclick = () => {
 const input = document.getElementById("userNameInput");
 if (input) { const name = input.value.trim(); userName = name || '朋友'; }
 const topbarName = document.getElementById("topbarName");
 if (topbarName) topbarName.textContent = userName ? '👤 ' + userName : '';
 ans = {};
 showScreen("testScreen");
};
document.getElementById("homeBtn").onclick = () => showScreen("introScreen");
document.getElementById("retestBtn").onclick = () => {
 ans = {};
 showScreen("introScreen");
};
document.getElementById("submitBtn").onclick = () => {
 if (Object.keys(ans).length < 48) { alert("请完成所有题目再提交哦～ 😊"); return; }
 calculateResult();
};

function calculateResult() {
 const s = id => ans[id] || 0;
 const styles = [
  {n:"官僚型", s:s(4)+s(8)+s(19)+s(27)+s(33)+s(36), key:"bureaucratic", d:"重规则、讲流程、强执行，适合紧急决策、标准化场景"},
  {n:"权威型", s:s(2)+s(17)+s(20)+s(25)+s(31)+s(38), key:"authoritative", d:"定方向、控全局、给标准，适合变革、定愿景场景"},
  {n:"创新型", s:s(5)+s(12)+s(18)+s(26)+s(35)+s(40), key:"creative", d:"重愿景、敢冒险、鼓励创意，适合复杂问题、破局创新"},
  {n:"带头型", s:s(6)+s(9)+s(21)+s(39)+s(47)+s(48), key:"pacesetting", d:"高效率、高标准、以身作则，适合高手团队、快速攻坚"},
  {n:"民主型", s:s(3)+s(10)+s(32)+s(42)+s(43)+s(46), key:"democratic", d:"重共识、听意见、集体决策，适合集思广益、需要认同"},
  {n:"亲和型", s:s(1)+s(13)+s(23)+s(24)+s(29)+s(44), key:"supportive", d:"重和谐、顾情绪、团队凝聚，适合提士气、修复关系"},
  {n:"教练型", s:s(7)+s(15)+s(28)+s(37)+s(41)+s(45), key:"coaching", d:"重培养、给反馈、助力成长，适合人才发展、一对一辅导"},
  {n:"无私型", s:s(11)+s(14)+s(16)+s(22)+s(30)+s(34), key:"servant", d:"重服务、善倾听、赋能他人，适合文化建设、长期团队"}
 ];
 styles.sort((a, b) => b.s - a.s);

 const top = styles[0];
 const result = styleData[top.key];
 const matchPct = Math.round((top.s / 18) * 100);

 // All scores for display
 const allScoresHtml = styles.map(i => {
   const d = styleData[i.key];
   const pct = Math.round((i.s / 18) * 100);
   return `<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
     <span style="font-size:18px;">${d.emoji}</span>
     <span style="font-weight:700;font-size:13px;color:${d.color};width:56px;">${d.name}</span>
     <div style="flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden;">
       <div style="height:100%;width:${pct}%;background:${d.color};border-radius:4px;transition:width .6s;"></div>
     </div>
     <span style="font-weight:700;font-size:14px;color:${d.color};width:40px;text-align:right;">${i.s}分</span>
     <span style="font-size:12px;color:#999;width:36px;">${pct}%</span>
   </div>`;
 }).join('');

 const othersHtml = styles.slice(1).map(i => {
   const d = styleData[i.key];
   return `<span class="other-style-chip" style="border-color:${d.color};color:${d.color};">${d.emoji} ${d.name} ${i.s}分</span>`;
 }).join('');

 const tipsHtml = result.tips.map(t => `<li>${t}</li>`).join('');
 const viewHtml = styles.slice(1).map(i => {
   const d = styleData[i.key];
   return `<div class="others-view-card" style="border-color:${d.color};">
     <span class="card-emoji">${d.emoji}</span>
     <div>
       <div class="card-label" style="color:${d.color};">${d.name}眼中：</div>
       <div class="card-text">${result.view[i.key] || ''}</div>
     </div>
   </div>`;
 }).join('');

 document.getElementById("resultContent").innerHTML = `
   <div class="result-header animate-in">
     ${userName ? `<div style="font-size:18px;font-weight:800;color:#333;margin-bottom:4px;">👤 ${userName}</div>` : ''}
     <div class="result-icon-wrap scale-in" style="background:${result.bg};">${result.emoji}</div>
     <div class="type-badge" style="background:${result.bg};color:${result.color};">🏆 你的主导风格</div>
     <div class="type-name" style="color:${result.color};">${result.name}</div>
     <div class="match-badge">综合匹配度 ${matchPct}%</div>
   </div>

   <div class="analysis-box animate-in" style="animation-delay:.05s;">
     <div class="box-title">📊 各风格得分一览</div>
     ${allScoresHtml}
   </div>

   <div class="analysis-box animate-in" style="animation-delay:.1s;">
     <div class="box-title">💬 ${result.name} — ${result.desc.split('！')[0]}！</div>
     <p class="desc-text">${result.desc}</p>
   </div>

   <div class="analysis-box animate-in" style="animation-delay:.2s;">
     <div class="box-title">🤝 与不同风格相处指南</div>
     <ul class="tips-list">${tipsHtml}</ul>
   </div>

   <div class="analysis-box animate-in" style="animation-delay:.3s;">
     <div class="box-title">👀 别人眼中的你</div>
     <div class="others-view-grid">${viewHtml}</div>
   </div>

   <div class="other-styles animate-in" style="animation-delay:.35s;">
     <span style="font-size:13px;color:#999;">其他风格：</span>${othersHtml}
   </div>
 `;

 showScreen("resultScreen");
}

function showScreen(id) {
 document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
</script>
</body>
</html>
